appId: com.electricreader.app
productName: electricReader

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: electricReader
  artifactName: electricReader-${version}-${arch}-setup.${ext}
